spring.config.import=optional:file:.env[.properties]
spring.application.name=cashpilot-backend

spring.datasource.url=jdbc:mysql://localhost:3306/cashpilot
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8000
ai.service.url=http://localhost:8080
jwt.secret=CashPilotSecretKeyForDevelopmentOnly2026VeryLongSecretKey123456789
jwt.expiration-ms=86400000